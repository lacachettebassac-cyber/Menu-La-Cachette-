function thumbFallback(img){
  var list = img.getAttribute('data-fb');
  if(list){ var a=list.split('|'); var nxt=a.shift();
    img.setAttribute('data-fb', a.join('|')); img.src=nxt; return; }
  var t=document.createElement('div');
  t.innerHTML = ICONS[img.getAttribute('data-ic')]||'';
  var s=t.firstChild; if(s&&img.parentNode) img.parentNode.replaceChild(s,img);
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function catLabel(t){ return SITE_LANG==='en' ? (CAT_TITLES_EN[t]||t) : t; }
var PRODUCT_NAME_EN = {'Cambodia Rouge':'Cambodia Red','Cambodia Bleue':'Cambodia Blue','Cambodia Verte':'Cambodia Green','Cambodia Bouteille':'Cambodia Bottle'};
function productLabel(n){ return SITE_LANG==='en' ? (PRODUCT_NAME_EN[n]||n) : n; }
function applyUiText(){
  var t = UI_TEXT[SITE_LANG];
  var sub = document.querySelector('.subtitle'); if(sub) sub.textContent = t.subtitle;
  var si = document.getElementById('searchInput'); if(si){ si.placeholder = t.searchPh; si.setAttribute('aria-label', t.searchAria); }
  var mn = document.getElementById('menu'); if(mn) mn.setAttribute('aria-label', t.menuAria);
  var se = document.getElementById('searchEmpty'); if(se) se.textContent = t.searchEmpty;
  var cn = document.getElementById('catNav'); if(cn) cn.setAttribute('aria-label', t.catNavAria);
  var fb = document.querySelector('.floating-bar'); if(fb) fb.setAttribute('aria-label', t.barAria);
  var sr = document.querySelector('.social-row'); if(sr) sr.setAttribute('aria-label', t.socialAria);
  var rb = document.querySelector('.review-btn'); if(rb) rb.textContent = t.review;
  document.querySelectorAll('.drink-close, .happy-close, .iptv-close').forEach(function(b){ b.setAttribute('aria-label', t.close); });
  var ht = document.getElementById('happyTitle'); if(ht) ht.textContent = t.happyTitle;
  var htime = document.querySelector('.happy-time'); if(htime) htime.textContent = t.happyTime;
  var hoff = document.querySelector('.happy-offer'); if(hoff) hoff.innerHTML = t.happyOffer + '<br>' + t.happyNote;
  var hcta = document.querySelector('.happy-cta'); if(hcta) hcta.textContent = t.happyCta;
  var tl = document.getElementById('langToggleLabel'); if(tl) tl.textContent = t.toggleLabel;
  document.documentElement.lang = SITE_LANG;
}
function setSiteLang(l){
  SITE_LANG = l; try{ localStorage.setItem('siteLang', l); }catch(e){}
  applyUiText(); renderMenu(); renderNav(); setupScrollSpy();
  if(typeof setupReveal === 'function'){ setupReveal(); } else { document.querySelectorAll('.product-card').forEach(function(c){ c.classList.add('in'); }); }
  if(typeof _lang !== 'undefined'){ _lang = l==='en' ? 'en' : 'fr'; }
}
function badgeHtml(b){
  if(!b) return '';
  var label = b==='nouveau' ? UI_TEXT[SITE_LANG].badgeNouveau : (b==='populaire' ? UI_TEXT[SITE_LANG].badgePopulaire : b);
  return '<span class="product-badge badge-'+esc(b)+'">'+esc(label)+'</span>';
}

var ACCENT_NAV={orange:'#ff9f1c',bleu:'#4361ee',vert:'#06ffa5',rose:'#ff71ce',turquoise:'#00d4aa',or:'#ffd700',cyan:'#00f0ff',rouge:'#ff2a6d','bleu-clair':'#bce3f2',violet:'#c084fc'};
function catId(t){ return 'cat-'+t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function renderMenu(){
  var root = document.getElementById('menu');
  var html = '';
  MENU.forEach(function(cat){
    html += '<section class="category neon-'+esc(cat.neon)+'" id="'+catId(cat.title)+'">'
         +    '<div class="category-header">'
         +      '<div class="category-icon" aria-hidden="true">'+cat.emoji+'</div>'
         +      '<div><h2 class="category-title">'+esc(catLabel(cat.title))+'</h2></div>'
         +    '</div><div class="products-grid">';
    cat.products.forEach(function(p){
      html += '<div class="product-card" role="button" tabindex="0" data-name="'+esc(p.name.toLowerCase())+'" data-real="'+esc(p.name)+'" aria-label="'+esc(productLabel(p.name))+', '+esc((p.price||'').replace(/<[^>]+>/g,''))+' '+UI_TEXT[SITE_LANG].dollars+'. '+UI_TEXT[SITE_LANG].detail+'.">'
           +    '<img class="product-mini" src="'+esc(p.img)+'" data-ic="'+esc(p.ic||'bottle')+'" alt="'+esc(p.name)+'" loading="lazy" onerror="thumbFallback(this)">'
           +    '<div class="product-info"><div class="product-name">'+esc(productLabel(p.name))+badgeHtml(p.badge)+'</div></div>'
           +    '<div class="product-price">'+(p.price||'')+'</div>'
           +  '</div>';
    });
    html += '</div></section>';
  });
  root.innerHTML = html;
}
function renderNav(){
  var nav=document.getElementById('catNav'); if(!nav) return; var html='';
  MENU.forEach(function(cat){
    var ac=ACCENT_NAV[cat.neon]||'#ffffff';
    html += '<button class="cat-pill" type="button" data-target="'+catId(cat.title)+'" style="--pa:'+ac+'" onclick="jumpCat(\''+catId(cat.title)+'\')">'
         +    '<span aria-hidden="true">'+cat.emoji+'</span> '+esc(catLabel(cat.title))+' <b class="cnt">'+cat.products.length+'</b></button>';
  });
  nav.innerHTML=html;
}
function jumpCat(id){ var el=document.getElementById(id); if(!el) return;
  var y=el.getBoundingClientRect().top+window.pageYOffset-72; window.scrollTo({top:y,behavior:'smooth'}); }
function setupScrollSpy(){
  var pills=document.querySelectorAll('.cat-pill'); var nav=document.getElementById('catNav');
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){ if(e.isIntersecting){ var id=e.target.id;
      pills.forEach(function(p){ var on=p.getAttribute('data-target')===id; p.classList.toggle('active',on);
        if(on&&nav){ nav.scrollTo({left:p.offsetLeft-nav.clientWidth/2+p.offsetWidth/2,behavior:'smooth'}); } });
    } });
  }, { rootMargin:'-66px 0px -70% 0px', threshold:0 });
  document.querySelectorAll('.category').forEach(function(s){ io.observe(s); });
}
function setupSearch(){
  var inp=document.getElementById('searchInput'); var empty=document.getElementById('searchEmpty'); if(!inp) return;
  inp.addEventListener('input', function(){
    var q=inp.value.trim().toLowerCase(); var any=false;
    document.querySelectorAll('.category').forEach(function(sec){
      var vis=0;
      sec.querySelectorAll('.product-card').forEach(function(c){
        var match = !q || c.getAttribute('data-name').indexOf(q)>-1;
        c.classList.toggle('hide', !match);
        if(match){ c.classList.add('in'); vis++; }
      });
      sec.classList.toggle('hide', vis===0);
      if(vis>0) any=true;
    });
    if(empty) empty.hidden = any;
  });
}
renderMenu(); renderNav(); setupScrollSpy(); setupSearch();

// bubbles
(function(){
  var wrap=document.getElementById('bubbles'); if(!wrap) return;
  var tints=['rgba(255,113,206,0.30)','rgba(192,132,252,0.30)','rgba(0,240,255,0.24)'];
  for(var i=0;i<28;i++){
    var b=document.createElement('span'); b.className='bubble';
    var s=7+Math.random()*22; b.style.width=b.style.height=s+'px';
    b.style.left=(Math.random()*100)+'%';
    var d=8+Math.random()*12; b.style.animationDuration=d+'s';
    b.style.animationDelay=(-Math.random()*d)+'s';
    b.style.background='radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), '+tints[i%3]+' 60%, transparent 72%)';
    wrap.appendChild(b);
  }
})();
// staggered reveal
function setupReveal(){
  var cards=document.querySelectorAll('.product-card:not(.in)');
  if(!('IntersectionObserver' in window)){ cards.forEach(function(c){c.classList.add('in');}); return; }
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold:0.08, rootMargin:'0px 0px -40px 0px' });
  cards.forEach(function(c,i){ c.style.transitionDelay=(Math.min(i,6)*0.04)+'s'; io.observe(c); });
}
setupReveal();

odia Verte": {"fr": "Lager Cambodia en canette — 4,4°.", "en": "Cambodia lager, can — 4.4%.", "kh": "ស្រាបៀរ Cambodia កំប៉ុង — ៤,៤°។"}, "Cambodia Bleue": {"fr": "Cambodia Lite en canette, plus légère — 4°.", "en": "Cambodia Lite, can — 4%.", "kh": "ស្រាបៀរ Cambodia Lite កំប៉ុង — ៤°។"}, "B-53": {"fr": "Shot en trois couches : café, crème irlandaise et vodka.", "en": "Three-layer shot: coffee liqueur, Irish cream and vodka.", "kh": "ស្រាស្រួចបីស្រទាប់ ៖ កាហ្វេ ក្រែម និងវ៉ូដកា។"}, "Slippery Nipple": {"fr": "Shot en couches : sambuca et crème irlandaise — doux et velouté.", "en": "Layered shot: sambuca and Irish cream.", "kh": "ស្រាស្រួចស្រទាប់ ៖ សំប៊ូកា និងក្រែមអៀរឡង់។"}, "Orgasme": {"fr": "Shooter en couches, doux et frais — crème de menthe et crème irlandaise.", "en": "Layered shooter: crème de menthe and Irish cream.", "kh": "ស្រាស្រួចស្រទាប់ ៖ ស្រាក្រូចបៃតង និងក្រែម។"}, "Cambodia Rouge": {"fr": "Lager Cambodia Premium en canette (rouge) — 4,4°.", "en": "Cambodia Premium lager, can (red) — 4.4%.", "kh": "ស្រាបៀរ Cambodia Premium កំប៉ុង (ក្រហម)។"}, "Captain Morgan Dark": {"fr": "Captain Morgan, version plus corsée et ambrée.", "en": "Captain Morgan, darker, fuller style.", "kh": "ស្រា Captain Morgan ខ្មៅ រសខ្លាំង។"}, "Bacardi Oro": {"fr": "Bacardi Carta Oro — rhum doré, doux et rond.", "en": "Bacardi Carta Oro — smooth golden rum.", "kh": "ស្រា Bacardi Carta Oro មាស។"}, "Havana Club Reserva": {"fr": "Havana Club Reserva — rhum cubain vieilli.", "en": "Havana Club Reserva — aged Cuban rum.", "kh": "ស្រា Havana Club Reserva ពីគុយបា។"}, "Jus d’Orange": {"fr": "Jus d’orange frais.", "en": "Fresh orange juice.", "kh": "ទឹកក្រូចស្រស់។"}, "Jus de Mangue": {"fr": "Jus de mangue.", "en": "Mango juice.", "kh": "ទឹកស្វាយ។"}, "Jus d’Ananas": {"fr": "Jus d’ananas.", "en": "Pineapple juice.", "kh": "ទឹកម្នាស់។"}, "Shot Get 27": {"fr": "Shot de Get 27 — liqueur de menthe verte, fraîche et glacée.", "en": "Get 27 shot — cool green peppermint liqueur.", "kh": "ស្រាស្រួច Get 27 — រសជាតិម្ទេសបៃតង ត្រជាក់។"}, "Ballantine's": {"fr": "Ballantine's Finest — blended scotch écossais, doux et équilibré.", "en": "Ballantine's Finest — smooth blended Scotch whisky.", "kh": "វីស្គី Ballantine's Finest ពីស្កុតឰេន។"}, "Jus de Pomme": {"fr": "Jus de pomme.", "en": "Apple juice.", "kh": "ទឹកប៉ោម។"}, "Jus de Cranberry": {"fr": "Jus de cranberry (canneberge).", "en": "Cranberry juice.", "kh": "ទឹក Cranberry។"}, "Jägerbomb": {"fr": "Jägerbomb : un shot de Jägermeister lâché dans l'energy drink — pétillant et puissant.", "en": "Jägerbomb: a Jägermeister shot dropped into energy drink.", "kh": "Jägerbomb ៖ ស្រា Jägermeister លាយជាមួយ​ភេសជ្ជៈ​ប៉ូវកម្លាំង។"}, "Shot Vodka": {"fr": "Shot de vodka On Off, pur et glacé.", "en": "On Off vodka shot, pure and ice-cold.", "kh": "ស្រាស្រួចវ៉ូដកា On Off សុទ្ធ និងត្រជាក់។"}, "Vodka Joss": {"fr": "Vodka Joss : vodka et Extra Joss réunis — le shot coup de fouet qui réveille, booste l'énergie et relance la soirée !", "en": "Vodka Joss: vodka meets Extra Joss — an energizing kick to recharge and power your night!", "kh": "Vodka Joss ៖ វ៉ូដកា លាយ Extra Joss — ស្រាស្រួចប៉ូវកម្លាំង ធ្វើឲ្យមានកម្លាំង និងរស់រវើក!"}, "Pablo Shot": {"fr": "Pablo Shot — shot à base de vodka, frais et gourmand.", "en": "Pablo Shot — vodka-based shot, fresh and smooth.", "kh": "ស្រាស្រួច Pablo Shot ជាមួយវ៉ូដកា ស្រស់ស្រាយ។"}, "Schweppes Tonic": {"fr": "Eau tonique à la quinine : amère, fine et pétillante, telle quelle ou à marier.", "en": "Quinine tonic water: bitter, fine and fizzy, on its own or as a mixer.", "kh": "ទឹកតូនិកមានជាតិល្វីង ៖ ល្វីង ល្អិត និងមានពពុះ ផឹកតែឯង ឬលាយ។"}, "Jose Cuervo Silver": {"fr": "Tequila blanco 100% agave, fraîche et vive : parfaite en shot ou dans une Margarita.", "en": "100% agave blanco tequila, fresh and lively: perfect as a shot or in a Margarita.", "kh": "តេគីឡាស ១០០% អាហ្គាវ៉េ ស្រស់ និងខ្លាំង ៖ ល្អផឹកម្តងអស់ ឬលាយជាម៉ាហ្គារីតា។"}};
let _lang="fr"; let _curName=null; let _lastFocus=null;
const ACCENT = {"orange":"#ff9f1c","bleu":"#4361ee","vert":"#06ffa5","rose":"#ff71ce","turquoise":"#00d4aa","or":"#ffd700","cyan":"#00f0ff","rouge":"#ff2a6d","bleu-clair":"#bce3f2","violet":"#c084fc"};
const _ov=document.getElementById('drinkOverlay'),
      _md=document.getElementById('drinkModal'),
      _th=document.getElementById('drinkThumb'),
      _nm=document.getElementById('drinkName'),
      _pr=document.getElementById('drinkPrice'),
      _ds=document.getElementById('drinkDesc');
function openDrink(card){
  _lastFocus = card;
  const name=card.querySelector('.product-name').childNodes[0].textContent.trim();
  const realName=card.getAttribute('data-real')||name;
  const sec=card.closest('.category'); let accent='rgba(255,255,255,0.5)';
  if(sec){ for(const c in ACCENT){ if(sec.classList.contains('neon-'+c)){ accent=ACCENT[c]; break; } } }
  _md.style.setProperty('--accent', accent);
  const mini=card.querySelector('.product-mini');
  const prod=(function(){for(const c of MENU)for(const p of c.products)if(p.name===realName)return p;return null;})();
  const catTitle=(function(){for(const c of MENU){ if(c.products.indexOf(prod)>-1) return c.title; } return ''; })();
  if(typeof gtag==='function'){ gtag('event','view_product',{ product_name: realName, product_category: catTitle }); }
  _th.innerHTML='';
  if(prod && prod.full){
    const fig=document.createElement('div'); fig.className='drink-figure';
    const im=document.createElement('img'); im.src=prod.full; im.alt=name; im.loading='lazy';
    fig.appendChild(im); _th.appendChild(fig);
  } else if(mini){
    const im=mini.cloneNode(true); im.classList.remove('product-mini'); im.classList.add('thumb-fallback');
    _th.appendChild(im);
  }
  var bw=document.createElement('div'); bw.className='burst-wrap';
  bw.innerHTML='<span class="burst-ring"></span><span class="burst-ring r2"></span>';
  for(var k=0;k<7;k++){ var sp=document.createElement('i'); sp.className='spark'; sp.style.setProperty('--a',(k*(360/7))+'deg'); bw.appendChild(sp); }
  _th.appendChild(bw);
  // stagger the price shine so prices don't flash in unison
  setTimeout(function(){ document.querySelectorAll('.product-price').forEach(function(p){ p.style.setProperty('--shine-delay',(Math.random()*6)+'s'); }); },0);
  _nm.textContent=name;
  const pr=card.querySelector('.product-price'); _pr.innerHTML=pr?pr.innerHTML:'';
  _curName=realName; renderDesc(); updateLangBtns();
  _ov.classList.add('open'); document.body.style.overflow='hidden';
  _md.querySelector('.drink-close').focus();
}
function renderDesc(){ var d=DESC[_curName]; _ds.textContent = d ? (d[_lang]||d.fr) : "Une valeur sûre de la maison."; }
function updateLangBtns(){ document.querySelectorAll(".lang-btn").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-l")===_lang); }); }
function setLang(l){ _lang=l; renderDesc(); updateLangBtns(); }
function closeDrink(){ _ov.classList.remove('open'); document.body.style.overflow='';
  if(_lastFocus){ _lastFocus.focus(); _lastFocus=null; } }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && _ov.classList.contains('open')) closeDrink(); });
document.getElementById('menu').addEventListener('click', e=>{
  const card=e.target.closest('.product-card'); if(card) openDrink(card);
});
document.getElementById('menu').addEventListener('keydown', e=>{
  if(e.key==='Enter' || e.key===' '){ const card=e.target.closest('.product-card');
    if(card){ e.preventDefault(); openDrink(card); } }
});
</script>

<script>
(function(){var ps=document.querySelectorAll('.product-price');ps.forEach(function(p){p.style.animationDelay=(Math.random()*4.5)+'s';});})();
</script>

    function openHappy(){ document.getElementById("happyOverlay").classList.add("open"); document.body.style.overflow="hidden"; }
    function closeHappy(){ document.getElementById("happyOverlay").classList.remove("open"); document.body.style.overflow="";
      try{ localStorage.setItem("happyHourSeen", new Date().toDateString()); }catch(e){} }
    document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeHappy(); });
    applyUiText();
    (function(){
      try{
        if(localStorage.getItem("happyHourSeen") === new Date().toDateString()) return;
      }catch(e){}
      setTimeout(openHappy, 600);
    })();
    </script>
